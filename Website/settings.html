<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Hot Beans Web | Settings
    </title>

    <link rel="stylesheet" href="style_sheets/settings.css">

</head>

<body>

    <!-- ========================= -->
    <!-- NAVIGATION BAR -->
    <!-- ========================= -->

    <div class="navbar">

        <a href="index.html" class="logo">

            <img src="images/HotBeansLogo.png" alt="Hot Beans Web Logo">

        </a>

    </div>

    <!-- ========================= -->
    <!-- SETTINGS CONTAINER -->
    <!-- ========================= -->

    <div class="settings-container">

        <h1 class="settings-title">
            Cocoa Bean Settings
        </h1>

        <p class="settings-subtitle">
            Control the animated cocoa bean background used across the website.
        </p>

        <!-- ========================= -->
        <!-- BEAN SETTINGS -->
        <!-- ========================= -->

        <div class="settings-section">

            <h2>Bean Preferences</h2>

            <!-- ENABLE/DISABLE BEANS ONLY -->

            <div class="setting-card">

                <div class="setting-header">

                    <div class="setting-text">

                        <h3>Enable Cocoa Beans</h3>

                        <p>
                            Turn the animated cocoa bean background on or off.
                        </p>

                    </div>

                    <label class="switch">

                        <input type="checkbox" id="toggle-beans" checked>

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </div>

        <!-- ========================= -->
        <!-- SAVE BUTTON -->
        <!-- ========================= -->

        <div class="save-section">

            <button class="settings-button" id="save-settings">
                Save Preferences
            </button>

        </div>

    </div>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <div class="footer">
        Hayden Thomson | Hot Beans Web | 2026
    </div>

    <!-- ========================= -->
    <!-- SETTINGS SCRIPT -->
    <!-- ========================= -->

    <script src="JavaScripts/SettingsSaver.js"></script>

</body>

</html>
